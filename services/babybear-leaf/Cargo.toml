# BabyBear identity leaf (B3) — pinned to canonical Plonky3 rev 27d59f7350 (CANON P-026 / Inv 5).
# Standalone crate ([workspace] excludes it from any parent workspace). Uses the canonical
# default_babybear_poseidon2_16() — NO hand-rolled constants. KAT-tested against 03_specs.
[package]
name = "babybear-leaf"
version = "0.0.0"
